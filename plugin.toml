id = "nandomoreirame/ghbar"
name = "Ghbar"
version = "0.1.0"
plugin_api = 22
author = "Fernando Moreira Costa"
license = "MIT"
icon = "bell"
description = "Unread GitHub notifications in the Noctalia bar, with an inbox panel to open and mark them read."
tags = ["github", "notifications", "bar"]
dependencies = []

[[setting]]
key = "notify_new"
type = "bool"
label_key = "settings.notify_new.label"
description_key = "settings.notify_new.description"
default = false

[[service]]
id = "poll"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 480
placement = "attached"
open_near_click = true
